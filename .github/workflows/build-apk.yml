
name: Build GCam Cinematic Pro X

on:
  workflow_dispatch:
  push:
    paths:
      - 'GCam_Cinematic_Pro_X_v0.2_Source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

      - name: Extract source
        run: |
          mkdir project
          unzip -q GCam_Cinematic_Pro_X_v0.2_Source.zip -d project

      - name: Set Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/build.gradle.kts")
          s = p.read_text()
          if "compileOptions {" not in s:
              s = s.replace("android {", """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""", 1)
          if "kotlinOptions {" not in s:
              s = s.replace("android {", """android {
              kotlinOptions {
                  jvmTarget = "17"
              }""", 1)
          else:
              import re
              s = re.sub(r'jvmTarget\s*=\s*["\']1\.8["\']', 'jvmTarget = "17"', s)
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd project
          ../gradle-8.9/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GCam-Cinematic-Pro-X-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
