
name: Build GCam Cinematic Pro X

on:
  workflow_dispatch:
  push:
    paths:
      - 'GCam_Cinematic_Pro_X_v0.2_Source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

      - name: Extract source code
        run: |
          mkdir project
          unzip -q GCam_Cinematic_Pro_X_v0.2_Source.zip -d project

      - name: Build APK
        run: |
          cd project
          ../gradle-8.9/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GCam-Cinematic-Pro-X-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
